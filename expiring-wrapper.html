<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Revolut Anleitung - Gesicherte Freigabe</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 100%;
            padding: 40px;
            text-align: center;
        }

        .header {
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 28px;
            color: #333;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
            font-size: 14px;
        }

        .status {
            margin: 30px 0;
            padding: 20px;
            border-radius: 8px;
            font-size: 16px;
        }

        .status.loading {
            background: #f0f0f0;
            color: #666;
        }

        .status.valid {
            background: #e8f5e9;
            color: #2e7d32;
        }

        .status.expired {
            background: #ffebee;
            color: #c62828;
        }

        .status-icon {
            font-size: 48px;
            margin-bottom: 10px;
        }

        .status-text {
            font-weight: 600;
            margin-bottom: 5px;
        }

        .status-desc {
            font-size: 12px;
            opacity: 0.8;
        }

        .button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 20px;
            transition: opacity 0.2s;
        }

        .button:hover:not(:disabled) {
            opacity: 0.9;
        }

        .button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .content-area {
            margin-top: 30px;
            text-align: left;
        }

        .footer {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #eee;
            font-size: 12px;
            color: #999;
        }

        .spinner {
            border: 3px solid #f0f0f0;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media (max-width: 600px) {
            .container {
                padding: 30px 20px;
            }

            .header h1 {
                font-size: 22px;
            }

            .button {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔐 Revolut Anleitung</h1>
            <p>Gesicherte Freigabe mit verfallenden Links</p>
        </div>

        <div id="status" class="status loading">
            <div class="spinner"></div>
            <div class="status-text">Wird überprüft...</div>
        </div>

        <button id="viewBtn" class="button" style="display: none;" onclick="viewContent()">
            📄 Anleitung anzeigen
        </button>

        <div class="footer">
            <p>Dieser Link verfällt nach 4 Tagen</p>
        </div>
    </div>

    <script>
        // Extract token from page URL (embedded server-side)
        let TOKEN = null;

        // Alternative: Extract from URL if parameter exists
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.has('token')) {
            TOKEN = urlParams.get('token');
        }

        // Also check the page structure for embedded token
        document.addEventListener('DOMContentLoaded', function() {
            // Try to find token from document
            if (!TOKEN) {
                const bodyHTML = document.body.innerHTML;
                const match = bodyHTML.match(/revolut-wallet-([a-f0-9]+)/);
                if (match && match[1]) {
                    TOKEN = match[1];
                }
            }

            // If no token found, extract from URL path
            if (!TOKEN) {
                const pathMatch = window.location.pathname.match(/\/share\/([a-f0-9]+)/);
                if (pathMatch && pathMatch[1]) {
                    TOKEN = pathMatch[1];
                }
            }

            if (!TOKEN) {
                showExpired('Kein Token gefunden');
                return;
            }

            checkToken();
        });

        function checkToken() {
            if (!TOKEN) {
                showExpired('Kein Token gefunden');
                return;
            }

            // Use relative URL - will resolve to the same origin
            const apiUrl = `/api/check?token=${encodeURIComponent(TOKEN)}`;

            fetch(apiUrl)
                .then(response => response.json())
                .then(data => {
                    if (data.valid) {
                        showValid(data.daysLeft);
                    } else {
                        showExpired('Dieser Link ist abgelaufen');
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    showExpired('Fehler beim Überprüfen');
                });
        }

        function showValid(daysLeft) {
            const statusDiv = document.getElementById('status');
            statusDiv.className = 'status valid';
            statusDiv.innerHTML = `
                <div class="status-icon">✅</div>
                <div class="status-text">Gültig</div>
                <div class="status-desc">Verfällt in ${daysLeft} ${daysLeft === 1 ? 'Tag' : 'Tagen'}</div>
            `;
            document.getElementById('viewBtn').style.display = 'block';
        }

        function showExpired(message = 'Dieser Link ist abgelaufen') {
            const statusDiv = document.getElementById('status');
            statusDiv.className = 'status expired';
            statusDiv.innerHTML = `
                <div class="status-icon">⏰</div>
                <div class="status-text">${message}</div>
                <div class="status-desc">Der Link ist nicht mehr gültig</div>
            `;
            document.getElementById('viewBtn').style.display = 'none';
        }

        function viewContent() {
            if (!TOKEN) {
                alert('Token nicht gefunden');
                return;
            }

            const viewBtn = document.getElementById('viewBtn');
            viewBtn.disabled = true;
            viewBtn.textContent = 'Wird geladen...';

            fetch(`/api/content?token=${encodeURIComponent(TOKEN)}`)
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }
                    return response.text();
                })
                .then(html => {
                    // Replace page content with actual content
                    document.documentElement.innerHTML = html;
                })
                .catch(error => {
                    console.error('Error loading content:', error);
                    alert('Fehler beim Laden des Inhalts');
                    viewBtn.disabled = false;
                    viewBtn.textContent = '📄 Anleitung anzeigen';
                });
        }
    </script>
</body>
</html>

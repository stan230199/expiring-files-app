<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Revolut Wallet Anleitung</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a0f3c 0%, #2d1b5e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: rgba(255,255,255,0.95);
            padding: 40px;
            border-radius: 12px;
            text-align: center;
            max-width: 500px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h1 { color: #1a0f3c; margin-bottom: 20px; }
        .status { font-size: 48px; margin: 20px 0; }
        p { color: #666; margin-bottom: 15px; }
        button {
            background: #7c3aed;
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }
        button:hover { background: #6d28d9; transform: translateY(-2px); }
        button:disabled { background: #999; cursor: not-allowed; }
        .expired { color: #dc2626; }
        .loading { color: #7c3aed; }
        #content { display: none; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📱 Revolut Wallet Anleitung</h1>
        <div id="loader">
            <p class="loading">⏳ Wird geladen...</p>
        </div>
        <div id="expired" style="display: none;">
            <p class="expired">⏰ Diese Anleitung ist abgelaufen!</p>
            <p>Der Link ist nicht mehr gültig.</p>
        </div>
        <div id="valid" style="display: none;">
            <p>✅ Gültig!</p>
            <button onclick="loadContent()">Anleitung anzeigen</button>
            <p style="font-size: 12px; color: #999; margin-top: 15px;">
                ID: <code id="token-display"></code>
            </p>
        </div>
    </div>

    <div id="content"></div>

    <script>
        // KONFIGURATION
        const SERVER = "https://dein-server.de"; // SPÄTER ANPASSEN!
        const TOKEN = "revolut-wallet-{{ TOKEN }}"; // Wird beim Generieren ersetzt

        document.getElementById('token-display').textContent = TOKEN;

        // Token beim Laden prüfen
        fetch(SERVER + "/api/check?token=" + encodeURIComponent(TOKEN))
            .then(r => r.json())
            .then(data => {
                document.getElementById('loader').style.display = 'none';
                if (data.valid) {
                    document.getElementById('valid').style.display = 'block';
                } else {
                    document.getElementById('expired').style.display = 'block';
                }
            })
            .catch(e => {
                document.getElementById('loader').innerHTML =
                    '<p class="expired">❌ Verbindungsfehler</p>' +
                    '<p style="font-size: 12px;">Server nicht erreichbar. Versuche es später.</p>';
            });

        function loadContent() {
            fetch(SERVER + "/api/content?token=" + encodeURIComponent(TOKEN))
                .then(r => r.text())
                .then(html => {
                    document.body.innerHTML = html;
                })
                .catch(e => alert('Fehler beim Laden: ' + e.message));
        }
    </script>
</body>
</html>
